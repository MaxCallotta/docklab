name: Feature request
description: Suggest an enhancement for DockLab
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting an improvement. Describe the problem you want to solve and the proposed behavior.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What workflow is currently difficult or missing?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe the desired behavior or feature.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Any alternative approaches you have considered.
